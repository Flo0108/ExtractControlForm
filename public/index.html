<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Situated Mapping</title>
<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- MarkerCluster AFTER Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet-canvas-layer/leaflet.canvaslayer.js"></script>

<style>
  html, body { height: 100%; margin: 0; font-family: sans-serif; }
  #map { width: 100%; height: 100%; }

  /* ---------- Sidebars ---------- */
  #tool-sidebar, #topic-sidebar {
    position: absolute;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 1000;
    background: rgba(255,255,255,0.9);
    padding: 10px;
    border-radius: 8px;
    max-height: 90%;
    overflow-y: auto;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  /* Tool sidebar: top-left */
  #tool-sidebar { top: 10px; left: 10px; }
  /* Topic sidebar: top-right */
  #topic-sidebar { top: 10px; right: 10px; }

  /* ---------- Buttons ---------- */
  button {
    cursor: pointer;
    padding: 8px 12px;
    border: 1px solid #ccc;
    background: #fff;
    border-radius: 6px;
    font-size: 16px;
    text-align: left;
    min-width: 50px;
    transition: all 0.2s ease-in-out;
  }

  button.selected {
    background: #c75430;
    color: #fff;
    border-color: #c75430;
  }

  #finishPolygonBtn {
    background: #007aff;
    color: #fff;
    border-color: #007aff;
  }

  /* ---------- Mobile adjustments ---------- */
  @media (max-width: 600px) {
    #tool-sidebar, #topic-sidebar {
      flex-direction: row;
      flex-wrap: wrap;
      bottom: 10px;
      top: auto;
      left: 10px;
      right: 10px;
      justify-content: space-around;
      max-height: none;
      width: auto;
      padding: 8px;
    }

    button {
      font-size: 18px;
      padding: 12px 16px;
      min-width: 60px;
      min-height: 48px;
    }

    #finishPolygonBtn {
      padding: 12px 16px;
      font-size: 18px;
    }
  }

  /* Optional: scrollbars for long sidebars */
  #tool-sidebar::-webkit-scrollbar,
  #topic-sidebar::-webkit-scrollbar {
    width: 6px;
  }

  #tool-sidebar::-webkit-scrollbar-thumb,
  #topic-sidebar::-webkit-scrollbar-thumb {
    background: rgba(0,0,0,0.2);
    border-radius: 3px;
  }

</style>
</head>
<body>

<!-- Tool Sidebar -->
<div id="tool-sidebar">
  <button data-tool="Point">📍 Point</button>
  <button data-tool="Line">📏 Line</button>
  <button data-tool="Arrow">➡️ Arrow</button>
  <button data-tool="Polygon">⬛ Area</button>
  <button data-tool="Volume">🟫 Volume</button>
  <button id="finishPolygonBtn" style="display:none;">✅ Finish Area</button>
</div>

<!-- Topic Sidebar -->
<div id="topic-sidebar">
  <button data-topic="Physical">Physical</button>
  <button data-topic="Environmental">Environmental</button>
  <button data-topic="Behavioral">Behavioral</button>
  <button data-topic="Atmospheric">Atmospheric</button>
  <button data-topic="Cultural">Cultural</button>
  <button data-topic="Temporal">Temporal</button>
</div>

<!-- Map Container -->
<div id="map"></div>

<!-- Firebase SDK (compat version) -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<!-- Custom Script -->
<script src="script.js"></script>

</body>
</html>
